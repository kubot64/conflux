version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "security"
    # Restrict to direct (top-level) dependencies. Indirect/transitive
    # updates land via the parent direct dep, which keeps the audit
    # surface small and avoids merging unreviewed transitive code.
    allow:
      - dependency-type: "direct"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "security"
    allow:
      - dependency-type: "direct"
    # github/codeql-action publishes init/autobuild/analyze as separate
    # sub-actions that MUST be pinned to the same version. Grouping keeps
    # them in a single PR; splitting caused a version mismatch that broke
    # the "Analyze (Go)" job (init 4.37.0 vs autobuild/analyze 4.36.2).
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action*"
